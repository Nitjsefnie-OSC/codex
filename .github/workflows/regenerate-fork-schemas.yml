name: regenerate-fork-schemas

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: regenerate-fork-schemas-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main

      - name: Reclaim runner disk
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.95.0"

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: codex-rs

      - name: Regenerate canonical schemas
        run: |
          cargo run --manifest-path codex-rs/Cargo.toml \
            -p codex-hooks --bin write_hooks_schema_fixtures
          python3 codex-rs/app-server-protocol/scripts/write_schema_fixtures.py
          python3 codex-rs/app-server-protocol/scripts/write_schema_fixtures.py \
            --experimental

      - name: Reject changes outside generated schema trees
        shell: bash
        run: |
          unexpected=0
          while IFS= read -r status_line; do
            path="${status_line:3}"
            case "$path" in
              codex-rs/hooks/schema/generated/*|codex-rs/app-server-protocol/schema/*)
                ;;
              *)
                echo "unexpected generated change: $status_line" >&2
                unexpected=1
                ;;
            esac
          done < <(git status --porcelain=v1 --untracked-files=all)
          test "$unexpected" -eq 0

      - name: Commit generated schemas to main
        shell: bash
        run: |
          git add -- codex-rs/hooks/schema/generated codex-rs/app-server-protocol/schema
          if git diff --cached --quiet; then
            echo "schemas already current"
            exit 0
          fi
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: regenerate fork schemas" \
            -m "Co-authored-by: GPT-5.6 Sol <noreply@openai.com>"
          git push origin HEAD:main
